server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip Compression (CRITICAL for performance) ────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff2;

    # ─── Security Headers ───────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ─── Service Worker: NEVER cache, proper MIME & scope ───────
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        types { application/javascript js; }
    }

    # ─── Web App Manifest: short cache, proper MIME ─────────────
    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        types { application/manifest+json json; }
    }

    # ─── SPA Fallback ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── index.html: NEVER cache (so deploys are instant) ───────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ─── Hashed JS/CSS: immutable cache 1 year ──────────────────
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ─── Images & fonts: cache 30 days ──────────────────────────
    location ~* \.(?:webp|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        access_log off;
    }
}
