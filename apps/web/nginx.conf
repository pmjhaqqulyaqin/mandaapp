server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip Compression ───────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # ─── Security Headers ───────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Static Assets with Hash (immutable cache 1 year) ──────
    # Vite generates filenames like: index-Cb0Q_rXB.js, vendor-RlQPIKT8.js
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ─── Images & Media (cache 30 days) ─────────────────────────
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ─── manifest.json (cache short for PWA updates) ────────────
    location = /manifest.json {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ─── SPA Fallback (no cache for index.html) ─────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # index.html must never be cached so deploy updates are instant
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
