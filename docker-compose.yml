services:
  postgres:
    image: postgres:17-alpine
    container_name: mandaapp_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mandaapp_prod}
    ports:
      - "127.0.0.1:5432:5432"  # Hanya accessible dari localhost/Docker internal, BUKAN dari internet
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/pg-override.conf:/etc/postgresql/pg-override.conf:ro
      - ./docker/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/pg-override.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mandaapp_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mandaapp_api
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - TZ=Asia/Makassar
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-mandaapp_prod}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - APP_URL=${APP_URL:-https://mandualotim.sch.id}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mandaapp_web
    restart: always
    ports:
      - "3080:80"
    depends_on:
      - api

volumes:
  pgdata:
