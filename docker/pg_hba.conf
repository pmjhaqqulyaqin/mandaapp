# ============================================================
# PostgreSQL Host-Based Authentication (pg_hba.conf)
# ============================================================
# TYPE   DATABASE   USER   ADDRESS         METHOD
# ============================================================

# Local connections (inside container) — TRUST (no password)
local   all        all                    trust

# Localhost IPv4 — TRUST
host    all        all    127.0.0.1/32    trust

# Localhost IPv6 — TRUST
host    all        all    ::1/128         trust

# Docker internal network (172.x.x.x) — TRUST (no password needed)
# Ini adalah "trik rahasia" yang menghilangkan masalah password selamanya.
# API connect dari Docker network, jadi tidak perlu password.
host    all        all    172.0.0.0/8     trust

# Semua koneksi lain — tetap perlu password (untuk keamanan)
host    all        all    0.0.0.0/0       md5
host    all        all    ::/0            md5
