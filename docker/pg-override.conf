# ============================================================
# PostgreSQL Custom Configuration for Mandaapp
# ============================================================
# Trik: Koneksi dari Docker internal network (172.x.x.x)
# menggunakan 'trust' auth — TIDAK perlu password.
# Ini menghilangkan masalah "password authentication failed"
# selamanya, karena API connect dari dalam Docker network.
# ============================================================

# Include default PostgreSQL config
data_directory = '/var/lib/postgresql/data'

# Listen on all interfaces (inside Docker)
listen_addresses = '*'

# Connection Settings
max_connections = 100
shared_buffers = 128MB

# Logging
log_timezone = 'Asia/Makassar'
timezone = 'Asia/Makassar'

# HBA (Host Based Authentication) Rules
# Diatur via hba_file di bawah
hba_file = '/etc/postgresql/pg_hba.conf'
